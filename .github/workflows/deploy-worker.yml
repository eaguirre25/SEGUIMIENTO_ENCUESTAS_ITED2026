name: Verificar asignaciones publicadas (solo lectura)
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Leer metadatos y conteos de cache (sin respuestas individuales)
        working-directory: worker
        run: >-
          npx wrangler d1 execute limesurvey-dashboard-cache --remote --env production
          --command "SELECT population, length(payload) AS bytes, json_extract(payload, '$.generatedAt') AS generated_at, json_extract(payload, '$.summary.total') AS total, json_extract(payload, '$.assignmentAudit.revision') AS revision, json_extract(payload, '$.assignmentAudit.matched') AS matched FROM dashboard_population_cache; SELECT json_extract(value, '$.classificationMethod') AS method, count(*) AS n FROM dashboard_population_cache, json_each(payload, '$.monitoringRows') WHERE population = 'students' GROUP BY method;"
      - name: Observar errores de Worker durante un minuto
        working-directory: worker
        run: |
          timeout 60s npx wrangler tail --env production --format pretty --status error || test "$?" = 124
